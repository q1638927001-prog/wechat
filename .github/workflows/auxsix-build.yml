name: Build AuxSix
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download procursus ldid for mac
        run: |
          curl -L "https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_x86_64" -o ldid
          chmod +x ./ldid
          sudo mv ./ldid /usr/local/bin/

      - name: Clone roothide/theos
        run: |
          git clone --depth 1 --recursive https://github.com/roothide/Theos.git ./theos

      - name: Build tweak
        run: |
          export THEOS=$PWD/theos
          make clean
          make
          mkdir -p output
          cp .theos/obj/debug/* output/ || true
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AuxSix
          path: output
